name: Documentation site

# Publishes bulkmailer.stoifl.app from docs/ with VitePress. GitHub Pages hosts
# one site per repository, so every deployment builds both branches:
#   main    -> bulkmailer.stoifl.app/      (production)
#   develop -> bulkmailer.stoifl.app/dev/  (development, see DOCS_CHANNEL in docs/.vitepress/config.mts)
# A push to either branch deploys both.
#
# Pull requests build their own docs but do not deploy: a dead internal link
# should fail review, not the live site. VitePress fails the build on one by
# default (ignoreDeadLinks is false in the config), so it will.
#
# One-time setup, outside this file: Settings -> Pages -> Source must be set
# to "GitHub Actions", the github-pages environment must allow deployments
# from both main and develop, and the custom domain needs a DNS record. See
# docs/contributing.md.
# The two path lists are duplicated rather than shared through a YAML anchor:
# GitHub Actions does not resolve anchors, so &x / *x here would not fail
# loudly - it would silently not filter.
on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "screenshots/**"
      - "assets/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "screenshots/**"
      - "assets/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# One group for all deployments: a newer run builds both branches anyway.
# Pull requests get a group of their own, so they never cancel a deployment.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'site' }}
  cancel-in-progress: true

jobs:
  check:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # lastUpdated in the VitePress config reads each page's git history;
          # a shallow clone would date every page to the checkout.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # `npm ci` needs package-lock.json and installs exactly what it pins.
      - run: npm ci

      # The prebuild script mirrors screenshots/ and assets/ into docs/public/
      # first - they live at the repository root because README.md uses them,
      # and VitePress only serves its own public directory.
      - name: Build the site
        run: npm run docs:build
        env:
          DOCS_CHANNEL: ${{ github.base_ref == 'develop' && 'development' || 'production' }}

  build:
    name: Build main and develop
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: production
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: develop
          path: development
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            development/package-lock.json

      - name: Build production (main)
        working-directory: production
        env:
          DOCS_CHANNEL: production
        run: |
          npm ci
          npm run docs:build

      - name: Build development (develop)
        working-directory: development
        env:
          DOCS_CHANNEL: development
        run: |
          npm ci
          npm run docs:build

      - name: Combine into one site
        run: |
          set -euo pipefail
          site=production/docs/.vitepress/dist
          cp -R development/docs/.vitepress/dist "$site/dev"
          rm -f "$site/dev/CNAME" # the custom domain belongs to the site root
          test -f "$site/CNAME"
          echo "CNAME: $(cat "$site/CNAME")"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: production/docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

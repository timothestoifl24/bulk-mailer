name: Publish Docker image

# Fires when GitLab CI mirrors a release tag here (see the mirror:github job
# in .gitlab-ci.yml on the GitLab side) - GitLab is the working repository,
# this repo only ever receives tagged releases, so "on tag push" here already
# means "on release".
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {} # manual re-run from the Actions tab, same trigger shape

env:
  # Always correct, no assumption needed: a GHCR image is namespaced under the
  # GitHub repository itself, unlike Docker Hub which would need a separate
  # username.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  contents: write # to attach release notes with softprops/action-gh-release
  packages: write # to push to the GitHub Container Registry

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GitHub injects this token into every workflow run automatically -
          # nothing to create or configure. It is unrelated to any GITHUB_TOKEN
          # variable set on the GitLab side (that one authenticates GitLab's
          # push *into* this repository; this one authenticates this workflow's
          # push *to the registry*, and never leaves GitHub's own systems).
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # No explicit `latest` entry here on purpose: metadata-action's
          # default flavor (latest=auto) already tags `latest` only for a
          # non-prerelease semver tag, and skips it for one with a `-` suffix
          # like v1.0.0-beta. A manual `type=raw,value=latest` entry would
          # bypass that and move `latest` onto every push, betas included.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/amd64 is what this project's own CI and every local test in
          # its history actually run and verify. Cross-arch (e.g. linux/arm64)
          # needs QEMU emulation this repository has not exercised - add it
          # with docker/setup-qemu-action@v3 and `platforms: linux/amd64,linux/arm64`
          # below once you have verified an arm64 image boots correctly.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Not inferred from the tag automatically - this action always
          # creates a regular release unless told otherwise. A tag containing
          # "-" (v1.0.0-beta, v1.0.0-rc1, ...) is this project's convention
          # for a pre-release; matches the same rule already applied to the
          # image's :latest tag in this same workflow and in .gitlab-ci.yml.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full history.

            ```
            docker pull ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

# First publish only: a package pushed to GHCR from a workflow inherits no
# visibility setting and starts out **private**, even though this repository
# is public - GitHub does not expose a way to set it public from the
# workflow itself. After the first successful run, go to the package page
# (repo sidebar -> Packages, or https://github.com/users/<you>/packages) ->
# Package settings -> Change visibility -> Public. One-time; later pushes to
# the same package keep whatever visibility you set.

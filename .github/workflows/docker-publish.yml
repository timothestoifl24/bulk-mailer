name: Publish Docker image

# Fires on a release tag. Tags are pushed by hand after tools/release.py has
# written the changelog entry and bumped __version__ into the commit the tag
# points at, so "on tag push" here already means "on release".
#
# Two gates run in parallel - `verify` checks the release commit describes
# itself, `tests` runs the suite on both databases - and `build-and-push`
# waits for both. A release that fails either should fail before an image
# exists, not after one is public.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {} # manual re-run from the Actions tab, same trigger shape

env:
  # Always correct, no assumption needed: a GHCR image is namespaced under the
  # GitHub repository itself, unlike Docker Hub which would need a separate
  # username.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  contents: write # to attach release notes with softprops/action-gh-release
  packages: write # to push to the GitHub Container Registry

jobs:
  # The changelog is not generated here. tools/release.py folds it into the
  # release commit before tagging, so the tag describes itself and browsing a
  # release's source shows its own notes. This job only checks the work was
  # done - which means nothing in CI needs write access to the repository.
  verify:
    name: Changelog and version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check CHANGELOG.md documents this tag, and __version__ agrees
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if ! grep -qF "## [$TAG]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section."
            echo "The entry belongs in the commit this tag points at. Prepare"
            echo "releases with: python tools/release.py ${TAG#v}"
            exit 1
          fi

          app_version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/__init__.py)
          if [ "$app_version" != "${TAG#v}" ]; then
            echo "::error::app/__init__.py says __version__ is '$app_version', but the tag is $TAG."
            echo "These have to agree, or a running instance reports a version it is not."
            exit 1
          fi

          echo "CHANGELOG.md documents $TAG, and __version__ agrees."

  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build-and-push:
    needs: [verify, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GitHub injects this token into every workflow run automatically -
          # nothing to create or configure, and it never leaves GitHub's own
          # systems. This repository has no configured secrets at all.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # No explicit `latest` entry here on purpose: metadata-action's
          # default flavor (latest=auto) already tags `latest` only for a
          # non-prerelease semver tag, and skips it for one with a `-` suffix
          # like v1.0.0-beta. A manual `type=raw,value=latest` entry would
          # bypass that and move `latest` onto every push, betas included.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # linux/amd64 is what this project's own CI and every local test in
          # its history actually run and verify. Cross-arch (e.g. linux/arm64)
          # needs QEMU emulation this repository has not exercised - add it
          # with docker/setup-qemu-action@v3 and `platforms: linux/amd64,linux/arm64`
          # below once you have verified an arm64 image boots correctly.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Not inferred from the tag automatically - this action always
          # creates a regular release unless told otherwise. A tag containing
          # "-" (v1.0.0-beta, v1.0.0-rc1, ...) is this project's convention
          # for a pre-release; the same rule metadata-action's latest=auto
          # already applies to the image's :latest tag above.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full history.

            ```
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ```

          # steps.meta.outputs.version, NOT github.ref_name: metadata-action's
          # {{version}} strips the leading "v", so the image is published as
          # :1.1.1 while the ref is v1.1.1. Interpolating the ref here printed
          # a pull command for a tag that does not exist - `docker pull ...:v1.1.1`
          # returns 404 - in every release note this workflow has ever written.
          # Taking it from the same step that pushed the image keeps the two
          # from drifting apart again.

# First publish only: a package pushed to GHCR from a workflow inherits no
# visibility setting and starts out **private**, even though this repository
# is public - GitHub does not expose a way to set it public from the
# workflow itself. After the first successful run, go to the package page
# (repo sidebar -> Packages, or https://github.com/users/<you>/packages) ->
# Package settings -> Change visibility -> Public. One-time; later pushes to
# the same package keep whatever visibility you set.

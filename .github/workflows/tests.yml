name: Tests

# The suite, on both supported databases, and the container image booted on
# both architectures. docker.yml calls this (workflow_call) for every pull
# request and every push to develop and main, and only publishes an image once
# it passed, so nothing reaches Docker Hub that the tests never saw. It has no
# push or pull_request trigger of its own: that would run everything twice.
on:
  workflow_call:
    inputs:
      version:
        description: Version the image is built as (X.Y.Z-beta.N, ...); empty for __version__
        type: string
        default: ""
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  sqlite:
    name: SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # No TEST_DATABASE_URL: conftest.py falls back to SQLite.
      - run: python -m pytest -q

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest

    # SQLite has no row locking, so it cannot exercise the multi-instance send
    # lock at all - that code path is only ever tested here.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mailer_test
          POSTGRES_USER: mailer
          POSTGRES_PASSWORD: mailer_ci_pw
        ports:
          - 5432:5432
        # A service container is started but not waited for: without a health
        # check the first connection races Postgres' own startup, which fails
        # intermittently rather than reproducibly.
        options: >-
          --health-cmd "pg_isready -U mailer -d mailer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # conftest.py drops and recreates this schema on every run, so it must
      # point at a throwaway database - which the service container above is.
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://mailer:mailer_ci_pw@localhost:5432/mailer_test

  # Builds the Dockerfile and proves the result starts. Without this, a change
  # to the base image is not exercised by anything on a pull request: the two
  # jobs above pin python-version 3.13 regardless of what the Dockerfile says,
  # and docker.yml only publishes after this passed. A Dependabot bump from
  # python:3.13-slim to 3.14-slim therefore went green while nothing had built
  # it - the first real build would have been at release time, when a failure
  # costs a broken release rather than a red pull request.
  #
  # Plain docker build rather than docker/build-push-action: this job exists to
  # test the Dockerfile, and wrapping it in another action would add a
  # dependency whose own updates this job cannot then validate.
  #
  # Once per published architecture, each on a native runner rather than under
  # emulation: an arm64 image that builds but cannot start (a dependency with
  # no aarch64 wheel, say) should fail here, not on someone's Apple Silicon
  # laptop or Graviton node after the release.
  image:
    name: Container image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: docker build --pull --build-arg BULK_MAILER_BUILD_VERSION="$VERSION" -t bulk-mailer:ci .

      - name: Start
        run: |
          docker run -d --name mailer-ci -p 8000:8000 \
            -e SECRET_KEY=ci-only-key-at-least-32-characters-long \
            -e ADMIN_PASSWORD=ci-only-password \
            bulk-mailer:ci

      - name: Wait for it to answer
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "up"; exit 0
            fi
            sleep 2
          done
          echo "::error::The container never answered on /healthz."
          exit 1

      - name: The version it reports is the version it was built as
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          reported=$(curl -fsS http://127.0.0.1:8000/healthz | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
          declared=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/__init__.py)
          # docker.yml builds betas and pull request images as X.Y.Z-beta.N / X.Y.Z-pr.N.
          expected=${VERSION:-$declared}
          echo "image reports $reported, expected $expected (source declares $declared)"
          test "$reported" = "$expected"

      - name: The CLI runs
        run: docker exec mailer-ci python -m app.cli list-users

      - name: Container log
        if: always()
        run: docker logs mailer-ci

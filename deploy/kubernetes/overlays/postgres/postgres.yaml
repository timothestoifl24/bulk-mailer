# A single PostgreSQL instance for Bulk Mailer. Enough for this app's load;
# for backups, failover and upgrades handled for you, prefer an operator
# (CloudNativePG, for instance) or a managed database, and set DATABASE_URL
# in the base secret.env instead of using this overlay.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: bulk-mailer
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: bulk-mailer
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: bulk-mailer
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bulk-mailer
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulk-mailer
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # uid/gid 70 is the "postgres" user of the alpine image; running as it
      # directly (rather than starting as root and dropping privileges) keeps
      # the pod within the restricted Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: mailer
            - name: POSTGRES_DB
              value: mailer
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bulk-mailer-postgres
                  key: POSTGRES_PASSWORD
            # A subdirectory: the volume's root may hold lost+found, and
            # initdb refuses a directory that is not empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mailer", "-d", "mailer"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "mailer", "-d", "mailer"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

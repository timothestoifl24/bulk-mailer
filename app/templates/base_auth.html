<!doctype html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>{% block title %}Bulk Mailer{% endblock %}</title>
</head>
<body class="d-flex flex-column bg-surface-secondary">
{% from "_icons.html" import icon %}
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <span class="text-primary">{{ icon('mail', 40) }}</span>
      <div class="h1 mt-2">Bulk Mailer</div>
    </div>
    {% for flash in flashes %}
      <div class="alert alert-{{ flash_classes.get(flash.category, 'info') }}" role="alert">{{ flash.message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>
</div>
<script src="/static/vendor/tabler/tabler.min.js" defer></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="Bulk Mailer">
  <title>Bulk Mailer</title>
  <!-- The tile carries its own background, so one file reads the same on light
       and dark pages. The darker strip under it is the tile's raised edge. -->
  <rect y="5" width="96" height="91" rx="24" fill="#3730A3"/>
  <rect width="96" height="90" rx="24" fill="#4F46E5"/>
  <!-- Shadow the plane casts on the tile, and three trails: one message, many people. -->
  <polygon points="86,28 24,56 50,64 58,86" fill="#3730A3" opacity=".6"/>
  <path d="M12 64h12M8 74h16M16 84h8" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round"/>
  <!-- The folded plane: top wing, body fold, keel. Flat shades, no gradients,
       so it stays crisp down to favicon size. -->
  <polygon points="80,18 16,46 44,54" fill="#FFFFFF"/>
  <polygon points="80,18 44,54 54,78" fill="#C7D2FE"/>
  <polygon points="44,54 38,70 54,78" fill="#818CF8"/>
</svg>

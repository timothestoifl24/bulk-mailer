# Pipeline for the bulk mailer.
#
# The presence of this file turns Auto DevOps off for the project. Auto DevOps
# cannot test this app: its Python buildpack has no test support ("Selected
# buildpack does not support test feature"), and Auto Build produces artifacts
# this repository has no use for. The jobs below run the real test suite
# against both supported databases and build the image from our own Dockerfile.
#
# The release stage (tags only) mirrors the tagged commit to the public GitHub
# repository, which in turn runs a GitHub Action that publishes the image to
# the GitHub Container Registry (see .github/workflows/docker-publish.yml),
# updates CHANGELOG.md from the commits since the previous tag, and creates a
# GitLab Release. The mirror and changelog jobs need CI/CD variables this
# repository does not ship with secrets for; each is written to skip itself
# with a clear explanation when its variables are unset, rather than turning
# the pipeline red for something that was never configured. To enable them:
#
#   GITHUB_TOKEN     A GitHub personal access token with write access to the
#                     target repository (classic PAT with the `repo` scope,
#                     or a fine-grained token scoped to it with "Contents:
#                     write"). Masked, protected.
#
#   GITHUB_REPO      The target repository as `owner/name`, e.g.
#                     timothestoifl24/bulk-mailer. Not sensitive; a plain
#                     variable is fine.
#
#   CI_DEPLOY_USER,   Push the generated changelog back to this project's own
#   CI_DEPLOY_PASSWORD default branch. A GitLab Deploy Token (Settings >
#                     Repository > Deploy tokens) with the write_repository
#                     scope, masked and protected. Naming the token exactly
#                     `gitlab-deploy-token` makes GitLab populate both of
#                     these automatically in every pipeline - nothing further
#                     to configure in that case. CI_JOB_TOKEN is intentionally
#                     not used here: it cannot push to a protected default
#                     branch unless that is separately allowed in project
#                     settings.
#
# The token is never placed in a URL: a failed push would otherwise echo the
# credential back in git's own error message. It travels as a Basic-auth
# Authorization header set with `-c http.extraHeader`, which git does not
# print on error.
#
# "Protected" variables only need setting if the release is cut from a
# protected branch/tag, which it should be - check Settings > Repository >
# Protected tags covers the tag pattern you release with (e.g. v*).

stages:
  - test
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  REGISTRY: $CI_REGISTRY
  IMAGE: $CI_REGISTRY_IMAGE
  # These two must agree, and nothing may override one of them on its own:
  # an empty DOCKER_TLS_CERTDIR makes dind serve plain TCP on 2375, while any
  # value makes it serve TLS on 2376 *only*. Setting the certdir per job while
  # the host still says 2375 is what produced
  # "Cannot connect to the Docker daemon at tcp://docker:2375".
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# One pipeline per change: on merge requests, and on branches without an open
# merge request. Avoids the duplicate branch+MR pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.python:
  image: python:3.13-slim
  interruptible: true
  cache:
    key:
      files:
        - requirements-dev.txt
    paths:
      - .cache/pip
  before_script:
    - pip install --quiet -r requirements-dev.txt

# The suite defaults to SQLite: no service container needed.
test:sqlite:
  extends: .python
  stage: test
  script:
    - python -m pytest -q --junitxml=report-sqlite.xml
  artifacts:
    when: always
    reports:
      junit: report-sqlite.xml
    expire_in: 1 week

# The same suite against PostgreSQL. conftest.py drops and recreates the
# schema, so this must point at a throwaway database - never a real one.
test:postgres:
  extends: .python
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: mailer_test
    POSTGRES_USER: mailer
    POSTGRES_PASSWORD: mailer_ci_pw
    TEST_DATABASE_URL: "postgresql+psycopg://mailer:mailer_ci_pw@postgres:5432/mailer_test"
  script:
    - python -m pytest -q --junitxml=report-postgres.xml
  artifacts:
    when: always
    reports:
      junit: report-postgres.xml
    expire_in: 1 week

# Builds the Dockerfile in this repository and pushes to the project's
# container registry. Needs a runner with the docker-in-docker service; if the
# runners cannot provide one, delete this job - the tests above stand alone.
build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  interruptible: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    # dind takes a moment to come up, and when it cannot come up at all the
    # build otherwise fails with an unexplained "Cannot connect to the Docker
    # daemon". Say which of the two it is.
    - |
      for _ in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        sleep 1
      done
      if ! docker info >/dev/null 2>&1; then
        echo "The docker:dind service is not reachable at $DOCKER_HOST."
        echo "Most likely this runner cannot start privileged containers, so dind"
        echo "never came up. Either enable privileged mode on the runner, or drop"
        echo "this job - test:sqlite and test:postgres do not depend on it."
        exit 1
      fi
      docker version
  script:
    - apk add --no-cache findutils coreutils
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build --pull -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    # Only a tagged release or the default branch updates the moving tags.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
        docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
      fi
    - |
      # A tag containing "-" (v1.0.0-beta, v1.0.0-rc1, ...) is a pre-release by
      # this project's tagging convention - :latest must never move to point at
      # one. A push to the default branch (CI_COMMIT_TAG unset) still moves it,
      # unchanged from before. Mirrors the GHCR side, which gets the same
      # behaviour for free from metadata-action's semver-aware latest=auto.
      case "$CI_COMMIT_TAG" in
        *-*)
          echo "$CI_COMMIT_TAG looks like a pre-release - not moving :latest."
          ;;
        *)
          docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
          docker push $CI_REGISTRY_IMAGE:latest
          ;;
      esac

# Publishes the exact commit a release tag points to as the public GitHub
# repository's default branch, plus the tag itself. Pushing the branch here
# (rather than mirroring every commit) is what makes this "only on new
# releases" - GitLab stays the working repository, GitHub only ever sees a
# fast-forward to what was just tagged.
mirror:github:
  stage: release
  # Not alpine/git: its image ENTRYPOINT is `git` itself, so GitLab's script
  # wrapper (which runs each job as `sh -c "..."`) gets executed as
  # `git sh -c "..."` instead - "git: 'sh' is not a git command". Plain alpine
  # with git installed avoids that entirely.
  image: alpine:latest
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    # A shallow clone would push an incomplete history to GitHub.
    GIT_DEPTH: "0"
    # A rejected push (bad/expired token) otherwise makes git retry by trying
    # to prompt for a username - there is no terminal in this container, so
    # that retry itself fails with a confusing "could not read Username ...
    # No such device or address" that hides the real 401 reason. This makes
    # it fail cleanly on the first attempt instead.
    GIT_TERMINAL_PROMPT: "0"
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -e
      if [ -z "$GITHUB_TOKEN" ] || [ -z "$GITHUB_REPO" ]; then
        echo "GITHUB_TOKEN and/or GITHUB_REPO are not set - skipping the GitHub mirror."
        echo "See the comment at the top of this file to enable it."
        exit 0
      fi
      AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
      TARGET="https://github.com/${GITHUB_REPO}.git"
      # Force only the branch: a release always reflects exactly what was
      # tagged, even if GitHub's main has diverged. Tags are pushed normally -
      # a name collision there should fail loudly, never overwrite silently.
      git -c http.extraHeader="AUTHORIZATION: basic ${AUTH}" \
        push --force "$TARGET" "HEAD:refs/heads/$CI_DEFAULT_BRANCH"
      git -c http.extraHeader="AUTHORIZATION: basic ${AUTH}" \
        push "$TARGET" "refs/tags/$CI_COMMIT_TAG"
      echo "Mirrored $CI_COMMIT_TAG to https://github.com/${GITHUB_REPO}"

# Generates a changelog entry from the commits since the previous tag and
# commits it to the default branch. Runs independently of mirror:github -
# GitHub only ever receives what was already tagged, so this always lands
# after the fact and is picked up by the *next* release's mirror push.
changelog:update:
  stage: release
  # See the comment on mirror:github's image - alpine/git's ENTRYPOINT hijacks
  # GitLab's script wrapper. Plain alpine with git installed avoids it.
  image: alpine:latest
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
    # See mirror:github - same reasoning, same fix.
    GIT_TERMINAL_PROMPT: "0"
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -e
      if [ -z "$CI_DEPLOY_USER" ] || [ -z "$CI_DEPLOY_PASSWORD" ]; then
        echo "CI_DEPLOY_USER and/or CI_DEPLOY_PASSWORD are not set - skipping the changelog update."
        echo "See the comment at the top of this file to enable it."
        exit 0
      fi
      if grep -qF "## [$CI_COMMIT_TAG]" CHANGELOG.md; then
        echo "CHANGELOG.md already has an entry for $CI_COMMIT_TAG, nothing to do."
        exit 0
      fi

      PREV_TAG=$(git describe --tags --abbrev=0 "${CI_COMMIT_TAG}^" 2>/dev/null || true)
      if [ -n "$PREV_TAG" ]; then
        RANGE="$PREV_TAG..$CI_COMMIT_TAG"
      else
        RANGE="$CI_COMMIT_TAG"
      fi

      {
        echo "## [$CI_COMMIT_TAG] - $(date -u +%Y-%m-%d)"
        echo
        git log "$RANGE" --no-merges --grep='^docs: changelog for' --invert-grep \
          --pretty=format:'- %s (%h)'
        echo
      } > new_section.md

      # A friendly nudge, not a hard failure: a tag/version mismatch is worth
      # noticing but shouldn't block the release notes from being generated.
      # sed, not grep -P: BusyBox grep has no -P (PCRE) support at all, so a
      # lookbehind here would just error out - masked by `|| true` below into
      # a silently-empty APP_VERSION rather than a job failure, but it meant
      # this check never actually ran.
      APP_VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/__init__.py || true)
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ -n "$APP_VERSION" ] && [ "$APP_VERSION" != "$TAG_VERSION" ]; then
        echo "Note: app/__init__.py says __version__ = \"$APP_VERSION\", tag is $CI_COMMIT_TAG."
      fi

      # Insert right after the "## [Unreleased]" heading, ahead of whatever
      # follows it - the most recent release always reads top-to-bottom.
      awk '
        /^## \[Unreleased\]/ {
          print
          print ""
          while ((getline line < "new_section.md") > 0) print line
          next
        }
        { print }
      ' CHANGELOG.md > CHANGELOG.md.new
      mv CHANGELOG.md.new CHANGELOG.md

      git config user.name "GitLab CI"
      git config user.email "gitlab-ci@$CI_SERVER_HOST"
      git add CHANGELOG.md
      # [skip ci]: this commit reaches the default branch and would otherwise
      # trigger another pipeline for a docs-only change.
      git commit -m "docs: changelog for $CI_COMMIT_TAG [skip ci]"
      AUTH=$(printf '%s:%s' "$CI_DEPLOY_USER" "$CI_DEPLOY_PASSWORD" | base64 -w0)
      git -c http.extraHeader="AUTHORIZATION: basic ${AUTH}" \
        push "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:refs/heads/$CI_DEFAULT_BRANCH"
      echo "CHANGELOG.md updated for $CI_COMMIT_TAG."

# GitLab's native Releases feature. Authenticates as the job itself - no
# extra credentials needed, unlike the two jobs above. The full notes live in
# CHANGELOG.md (or GitHub's auto-generated release notes); this is a shorter
# pointer so it stays correct even if the changelog commit above was skipped.
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  allow_failure: true
  script:
    - echo "Creating the GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG. See CHANGELOG.md for details."

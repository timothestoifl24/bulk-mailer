<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 96" width="400" height="96"
     role="img" aria-label="Bulk Mailer">
  <title>Bulk Mailer</title>
  <!-- The mark plus the name, for light backgrounds (dark ink). The copy for
       dark backgrounds is logo-wordmark-dark.svg; README.md switches between
       them with <picture> and prefers-color-scheme. -->
  <!-- The mark, same geometry as logo.svg. -->
  <rect y="5" width="96" height="91" rx="24" fill="#3730A3"/>
  <rect width="96" height="90" rx="24" fill="#4F46E5"/>
  <polygon points="86,28 24,56 50,64 58,86" fill="#3730A3" opacity=".6"/>
  <path d="M12 64h12M8 74h16M16 84h8" stroke="#A5B4FC" stroke-width="5"
        stroke-linecap="round"/>
  <polygon points="80,18 16,46 44,54" fill="#fff"/>
  <polygon points="80,18 44,54 54,78" fill="#C7D2FE"/>
  <polygon points="44,54 38,70 54,78" fill="#818CF8"/>
  <!-- An SVG shown through <img> cannot load web fonts, so the name falls back
       through system UI faces of similar proportions when Inter is not
       installed. The viewBox leaves room for the widest of them. -->
  <text x="118" y="64" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="-0.5" fill="#0F172A">Bulk Mailer</text>
</svg>

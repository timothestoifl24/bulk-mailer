<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="Bulk Mailer">
  <title>Bulk Mailer</title>
  <!-- A filled badge rather than bare strokes: it carries its own background,
       so the mark reads the same on GitHub's light and dark themes without
       needing two files and a <picture> switch. -->
  <defs>
    <linearGradient id="bm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a90e2"/>
      <stop offset="1" stop-color="#206bc4"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#bm-bg)"/>
  <!-- Two cards peeking out behind the envelope: "one message, many copies",
       which is the whole product in a glance. -->
  <rect x="33" y="22" width="30" height="16" rx="4" fill="#fff" opacity="0.35"/>
  <rect x="27" y="29" width="42" height="16" rx="4" fill="#fff" opacity="0.6"/>
  <!-- The envelope itself. -->
  <rect x="20" y="37" width="56" height="38" rx="5" fill="#fff"/>
  <path d="M25 42 L48 59 L71 42" fill="none" stroke="#206bc4" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="Bulk Mailer">
  <title>Bulk Mailer</title>
  <!-- A filled tile rather than bare strokes: it carries its own background,
       so the mark reads the same on light and dark themes without needing two
       files and a <picture> switch. Flat colours only, no gradients, so it
       stays crisp at favicon size and prints cleanly. -->
  <!-- The tile sits on a slightly darker copy of itself, 5px lower: a raised
       bottom edge that makes it feel like a key you could press. -->
  <rect y="5" width="96" height="91" rx="24" fill="#3730A3"/>
  <rect width="96" height="90" rx="24" fill="#4F46E5"/>
  <!-- The plane's shadow on the tile, offset down and right of the plane. -->
  <polygon points="86,28 24,56 50,64 58,86" fill="#3730A3" opacity=".6"/>
  <!-- Speed trails behind the plane: one message, on its way to many. -->
  <path d="M12 64h12M8 74h16M16 84h8" stroke="#A5B4FC" stroke-width="5"
        stroke-linecap="round"/>
  <!-- The folded paper plane, three facets lit from the top left: the top
       wing catches the light, the body fold is in half shade, and the keel
       underneath is darkest. -->
  <polygon points="80,18 16,46 44,54" fill="#fff"/>
  <polygon points="80,18 44,54 54,78" fill="#C7D2FE"/>
  <polygon points="44,54 38,70 54,78" fill="#818CF8"/>
</svg>
